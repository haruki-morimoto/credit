[workspace]
resolver = "2"
members = [
    "crates/credit-types",
    "crates/credit-crypto",
    "crates/credit-ponc",
    "crates/credit-zk",
    "crates/credit-consensus",
    "crates/credit-net",
    "crates/credit-storage",
    "crates/credit-sdk",
    "crates/credit-node",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/haruki-morimoto/credit"

[workspace.lints.rust]
unsafe_code = "forbid"

# Optimize finite-field, Curve25519, and Bulletproof IPA math in dev/test builds.
[profile.dev.package.credit-crypto]
opt-level = 2

[profile.dev.package.credit-zk]
opt-level = 2
