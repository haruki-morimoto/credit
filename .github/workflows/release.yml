name: Credits (XCR) Cross-Platform Binary Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package Release Binaries (${{ matrix.target_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            target_label: linux-x86_64
            ext: ""
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            target_label: windows-x86_64
            ext: ".exe"
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            target_label: macos-x86_64
            ext: ""
          - os: macos-15-intel
            rust_target: aarch64-apple-darwin
            target_label: macos-arm64
            ext: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux GUI build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Run workspace test suite before packaging
        if: matrix.rust_target != 'aarch64-apple-darwin'
        run: cargo test

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.rust_target }}
          if [ "${{ matrix.target_label }}" = "windows-x86_64" ]; then
            cargo build --release -p credit-desktop --target ${{ matrix.rust_target }}
          fi

      - name: Bundle archive & SHA-256 checksums
        shell: bash
        run: |
          STAGE="credits-${GITHUB_REF_NAME}-${{ matrix.target_label }}"
          BIN_DIR="target/${{ matrix.rust_target }}/release"
          mkdir -p "$STAGE"
          cp "${BIN_DIR}/credit-node${{ matrix.ext }}" "$STAGE/"
          cp "${BIN_DIR}/credit-cli${{ matrix.ext }}" "$STAGE/"
          cp "${BIN_DIR}/credit-gateway${{ matrix.ext }}" "$STAGE/"
          if [ -f "${BIN_DIR}/credit-desktop.exe" ]; then
            cp "${BIN_DIR}/credit-desktop.exe" "$STAGE/"
            cp "${BIN_DIR}/credit-desktop.exe" "credit-desktop-windows-x86_64.exe"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          cp -r docs "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi

      - name: Publish release archives to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Credits (XCR) ${GITHUB_REF_NAME}" --generate-notes || true
          fi
          for f in credits-*.tar.gz credits-*.tar.gz.sha256; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done
          if [ -f "credit-desktop-windows-x86_64.exe" ]; then
            gh release upload "$GITHUB_REF_NAME" "credit-desktop-windows-x86_64.exe" --clobber
          fi
